<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060d18">
<title>Anime Tier List — AnimeGuess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Sarabun:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Winter palette */
  --bg:#060d18;
  --bg2:#0a1628;
  --surface:rgba(140,200,255,.04);
  --border:rgba(140,190,255,.15);
  --border2:rgba(140,190,255,.32);
  --ice:#a8d8ff;
  --ice2:#5baee8;
  --frost:#d4eeff;
  --snow:#e8f4ff;
  --cold:#2a5f8a;
  --text:#dceeff;
  --muted:rgba(180,220,255,.45);
  --radius:10px;
  --sz:100px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;scrollbar-width:thin;scrollbar-color:rgba(140,190,255,.25) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:rgba(140,190,255,.3);border-radius:3px;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;overflow-x:hidden;}

/* winter gradient bg */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 10% 0%,rgba(30,80,160,.3) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 90% 100%,rgba(10,50,120,.35) 0%,transparent 65%),
    radial-gradient(ellipse 40% 40% at 50% 50%,rgba(20,60,130,.15) 0%,transparent 70%);}

#snowCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;background:rgba(6,13,24,.92);backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.logo-mark{width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--ice2),var(--cold));
  display:grid;place-items:center;font-size:15px;box-shadow:0 0 16px rgba(90,170,240,.4);}
.logo-txt{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:.15em;
  background:linear-gradient(135deg,#dceeff,var(--ice),var(--ice2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.back-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);
  font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);transition:all .2s;}
.back-link:hover{color:var(--text);border-color:var(--border2);}
.back-link svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.nav-r{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.nbtn{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);font-family:'Sarabun',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.nbtn:hover{color:var(--text);border-color:var(--border2);}
.nbtn.ice{background:linear-gradient(135deg,var(--ice2),var(--cold));color:#fff;border-color:transparent;}
.nbtn.ice:hover{filter:brightness(1.12);transform:translateY(-1px);}
.szrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
input[type=range]{width:80px;accent-color:var(--ice2);cursor:pointer;}

/* ── WRAP ── */
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:18px 14px 90px;}

/* ── TIER ROW ── */
.tier-row{display:flex;align-items:stretch;margin-bottom:4px;
  border-radius:8px;overflow:visible;
  border:1px solid rgba(140,200,255,.1);
  min-height:calc(var(--sz) + 10px);position:relative;
  background:rgba(10,22,45,.4);backdrop-filter:blur(4px);}
.tier-row.over>.dz{outline:2px solid rgba(140,190,255,.6);background:rgba(140,190,255,.07);}

/* ── LABEL ── */
.tier-lbl{
  width:90px;min-width:90px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  position:relative;flex-shrink:0;cursor:pointer;user-select:none;
  border-radius:8px 0 0 8px;transition:filter .15s;
}
.tier-lbl:hover{filter:brightness(1.1);}
/* hide edit hint — only show on hover */
.lbl-text{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;
  text-align:center;word-break:break-all;line-height:1.2;padding:0 5px;pointer-events:none;}
/* edit hint hidden by default, show on hover */
.lbl-hint{font-size:9px;opacity:0;transition:opacity .2s;letter-spacing:.04em;pointer-events:none;}
.tier-lbl:hover .lbl-hint{opacity:.6;}
.tier-lbl input.lbl-inp{display:none;position:absolute;inset:0;width:100%;height:100%;padding:6px;
  background:rgba(0,0,0,.5);border:none;outline:2px solid rgba(255,255,255,.35);
  text-align:center;font-family:'Orbitron',monospace;font-size:18px;font-weight:900;
  color:inherit;border-radius:8px 0 0 8px;}
.tier-lbl.ed .lbl-text,.tier-lbl.ed .lbl-hint{visibility:hidden;}
.tier-lbl.ed input.lbl-inp{display:block;}

/* ── COLOR POPUP ── */
.color-popup{display:none;position:absolute;left:96px;top:50%;transform:translateY(-50%);
  z-index:200;background:#071422;border:1px solid var(--border2);border-radius:10px;
  padding:10px;box-shadow:0 10px 32px rgba(0,0,0,.8);}
.color-popup.open{display:block;}
.color-popup label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em;}
.color-grid{display:grid;grid-template-columns:repeat(5,22px);gap:4px;}
.cpick{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;}
.cpick:hover{transform:scale(1.2);}
.cpick.sel{border-color:#fff;}
.cp-custom{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.cp-custom input[type=color]{width:28px;height:22px;border:none;border-radius:4px;cursor:pointer;padding:0;}

/* ── DROP ZONE ── */
.dz{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:4px;
  align-content:flex-start;min-height:calc(var(--sz) + 10px);
  transition:background .12s,outline .12s;}

/* ── ADD TIER ROW ── */
.add-row{display:flex;gap:7px;margin:8px 0 22px;flex-wrap:wrap;}
.atbtn{padding:7px 15px;border-radius:8px;border:1px dashed var(--border);background:transparent;
  color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;gap:5px;}
.atbtn:hover{color:var(--text);border-color:var(--border2);}

/* ── IMAGE CARD ── */
.card{width:var(--sz);height:var(--sz);position:relative;cursor:grab;flex-shrink:0;
  border-radius:3px;overflow:hidden;border:2px solid rgba(140,200,255,.1);
  transition:transform .13s,box-shadow .13s;}
.card:hover{transform:scale(1.08);z-index:10;
  box-shadow:0 6px 22px rgba(0,0,0,.7);border-color:rgba(140,200,255,.5);}
.card:active{cursor:grabbing;}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.card .cdel{display:none;position:absolute;inset:0;background:rgba(10,40,100,.8);
  align-items:center;justify-content:center;font-size:24px;cursor:pointer;}
.card:hover .cdel{display:flex;}
.card .ctip{display:none;position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,10,30,.85);font-size:10px;color:#c8e8ff;padding:3px 5px;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.card:hover .ctip{display:block;}
.card.dragging{opacity:.2;transform:scale(.88);}

/* ── POOL SECTION ── */
.pool-section{margin-top:16px;}
.pool-hdr{display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:11px;gap:14px;flex-wrap:wrap;}
.pool-ttl{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:6px;}

/* ── SEARCH TABS ── */
.srch-tabs{display:flex;gap:5px;margin-bottom:8px;}
.stab{padding:6px 14px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;font-weight:700;
  cursor:pointer;transition:all .15s;}
.stab:hover{color:var(--text);}
.stab.on{background:rgba(90,170,240,.14);border-color:rgba(90,170,240,.45);color:var(--ice);}

/* ── SEARCH AREA ── */
.srch-area{display:flex;flex-direction:column;gap:5px;flex:1;max-width:500px;}
.srch-wrap{position:relative;}
.srch-inp{width:100%;padding:10px 38px 10px 14px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:9px;color:var(--text);
  font-family:'Sarabun',sans-serif;font-size:14px;outline:none;transition:all .2s;}
.srch-inp:focus{border-color:var(--ice2);background:rgba(90,170,240,.07);}
.srch-inp::placeholder{color:rgba(180,220,255,.22);font-size:13px;}
.srch-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.35;pointer-events:none;}

/* ── ANIME BANNER ── */
.anime-banner{display:none;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(90,170,240,.08);border:1px solid rgba(90,170,240,.25);border-radius:9px;margin-bottom:8px;}
.anime-banner.show{display:flex;}
.ab-img{width:44px;height:60px;border-radius:5px;object-fit:cover;flex-shrink:0;border:1px solid rgba(140,200,255,.2);}
.ab-info{flex:1;min-width:0;}
.ab-title{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ab-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.ab-progress{font-size:11px;color:var(--ice);margin-top:4px;min-height:16px;}
.ab-load-btn{padding:8px 16px;border-radius:8px;border:none;
  background:linear-gradient(135deg,var(--ice2),var(--cold));color:#fff;
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;}
.ab-load-btn:hover{filter:brightness(1.1);}
.ab-load-btn:disabled{opacity:.5;cursor:default;}

/* ── AUTOCOMPLETE ── */
.ac-drop{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:300;
  background:linear-gradient(145deg,#071422,#050e1c);border:1px solid rgba(90,160,220,.3);
  border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.9);
  max-height:280px;overflow-y:auto;}
.ac-drop.open{display:block;}
.ac-drop::-webkit-scrollbar{width:3px;}
.ac-drop::-webkit-scrollbar-thumb{background:rgba(90,160,220,.4);border-radius:2px;}
.ac-item{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;
  border-bottom:1px solid rgba(90,160,220,.07);transition:background .1s;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.hl{background:rgba(90,160,220,.12);}
.ac-img-s{width:46px;height:46px;border-radius:5px;object-fit:cover;flex-shrink:0;}
.ac-nopic{width:46px;height:46px;border-radius:5px;background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ac-info{flex:1;min-width:0;}
.ac-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-badge{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(90,170,240,.18);
  color:var(--ice);font-weight:700;margin-top:3px;display:inline-block;}
.ac-load{padding:14px;text-align:center;color:var(--muted);font-size:13px;}
.ac-head{padding:5px 12px 3px;font-size:9px;letter-spacing:.4em;text-transform:uppercase;
  color:rgba(90,170,240,.55);background:rgba(0,0,0,.25);}

/* ── POOL BOX ── */
.pool-box{min-height:120px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;
  background:rgba(10,22,45,.4);border:1px solid var(--border);border-radius:var(--radius);
  align-content:flex-start;transition:background .12s,outline .12s;backdrop-filter:blur(4px);}
.pool-box.over{background:rgba(90,170,240,.08);outline:2px dashed rgba(90,170,240,.4);}
.pool-empty{width:100%;text-align:center;color:var(--muted);font-size:13px;
  padding:32px 0;pointer-events:none;line-height:2.4;}

/* ── GHOST ── */
#ghost{position:fixed;z-index:9999;pointer-events:none;display:none;
  width:80px;height:80px;border-radius:4px;overflow:hidden;
  border:2px solid rgba(140,200,255,.75);box-shadow:0 8px 28px rgba(0,0,0,.6);
  transform:translate(-50%,-50%) rotate(4deg);}
#ghost img{width:100%;height:100%;object-fit:cover;}

/* ── SPINNER ── */
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(140,200,255,.3);
  border-top-color:var(--ice);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toasts{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:7px;pointer-events:none;}
.toast{background:rgba(6,13,24,.96);border:1px solid var(--border2);border-radius:9px;
  padding:9px 14px;font-size:13px;color:var(--text);backdrop-filter:blur(10px);
  box-shadow:0 5px 22px rgba(0,0,0,.5);animation:tIn .22s ease both;max-width:300px;}
@keyframes tIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(14px)}}
.toast.out{animation:tOut .22s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap>*{animation:rise .38s ease both;}

/* page transition */
#curtain{position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:#060d18;opacity:1;transition:opacity .32s ease;}
#curtain.fade-in{opacity:0;pointer-events:none;}
#curtain.fade-out{opacity:1;pointer-events:all;}

@media(max-width:600px){
  :root{--sz:76px;}
  .tier-lbl{width:68px;min-width:68px;}
  .lbl-text{font-size:16px;}
}
</style>
</head>
<body>
<canvas id="snowCanvas"></canvas>
<div class="toasts" id="toasts"></div>
<div id="ghost"><img id="gimg" src="" alt=""></div>
<div id="curtain"></div>

<nav>
  <a class="nav-logo" href="index.html" onclick="event.preventDefault();warpTo('index.html')">
    <div class="logo-mark">❄️</div>
    <span class="logo-txt">ANIMEGUESS</span>
  </a>
  <div class="nav-r">
    <div class="szrow">
      <span>ขนาด</span>
      <input type="range" id="szSlider" min="70" max="160" value="100">
      <span id="szVal">100px</span>
    </div>
    <button class="nbtn" onclick="clearTiers()">🗑 ล้าง Tier</button>
    <button class="nbtn" onclick="resetAll()">↺ รีเซ็ต</button>
    <button class="nbtn ice" onclick="doExport()">📷 Export</button>
    <a class="back-link" href="index.html" onclick="event.preventDefault();warpTo('index.html')">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      กลับ
    </a>
  </div>
</nav>

<div class="wrap">
  <!-- BOARD -->
  <div id="boardWrap">
    <div id="board"></div>
    <div class="add-row">
      <button class="atbtn" onclick="addTier()">＋ เพิ่ม Tier ใหม่</button>
      <button class="atbtn" onclick="clearTiers()">🗑 ล้าง Tier ทั้งหมด</button>
    </div>
  </div>

  <!-- POOL -->
  <div class="pool-section">
    <div class="pool-hdr">
      <div class="pool-ttl">📌 Pin Images</div>
      <div class="srch-area">
        <div class="srch-tabs">
          <button class="stab on" id="tab-anime" onclick="setTab('anime',this)">🎌 อนิเมะ</button>
          <button class="stab" id="tab-char" onclick="setTab('char',this)">👤 ตัวละคร</button>
          <button class="stab" id="tab-movie" onclick="setTab('movie',this)">🎬 หนัง</button>
        </div>

        <!-- ANIME MODE -->
        <div id="mode-anime">
          <div class="anime-banner" id="animeBanner">
            <img class="ab-img" id="abImg" src="" alt="">
            <div class="ab-info">
              <div class="ab-title" id="abTitle">—</div>
              <div class="ab-meta" id="abMeta">—</div>
              <div class="ab-progress" id="abProgress"></div>
            </div>
            <button class="ab-load-btn" id="abLoadBtn" onclick="loadAllChars()">⬇ โหลดตัวละคร</button>
          </div>
          <div class="srch-wrap" id="animeSW">
            <input class="srch-inp" id="animeInp" placeholder="ค้นหาอนิเมะ เช่น One Piece, Naruto…" autocomplete="off">
            <span class="srch-ico">🎌</span>
            <div class="ac-drop" id="acAnime"></div>
          </div>
        </div>

        <!-- CHAR MODE -->
        <div id="mode-char" style="display:none">
          <div class="srch-wrap" id="charSW">
            <input class="srch-inp" id="charInp" placeholder="ค้นหาตัวละคร เช่น Naruto, Luffy…" autocomplete="off">
            <span class="srch-ico">👤</span>
            <div class="ac-drop" id="acChar"></div>
          </div>
        </div>

        <!-- MOVIE MODE -->
        <div id="mode-movie" style="display:none">
          <div class="anime-banner" id="movieBanner">
            <img class="ab-img" id="mvImg" src="" alt="" onerror="this.style.display='none'">
            <div class="ab-info">
              <div class="ab-title" id="mvTitle">—</div>
              <div class="ab-meta" id="mvMeta">—</div>
              <div class="ab-progress" id="mvProgress"></div>
            </div>
            <button class="ab-load-btn" id="mvLoadBtn" onclick="loadMovieCast()">⬇ โหลดนักแสดง</button>
          </div>
          <div class="srch-wrap" id="movieSW">
            <input class="srch-inp" id="movieInp" placeholder="ค้นหาหนัง เช่น Avengers, The Dark Knight…" autocomplete="off">
            <span class="srch-ico">🎬</span>
            <div class="ac-drop" id="acMovie"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="pool-box" id="pool"
      ondragover="dzo(event,this)" ondragleave="dzl(this)" ondrop="dzd(event,'pool')">
      <div class="pool-empty" id="pe">
        ❄️ ค้นหาอนิเมะหรือหนัง แล้วกดโหลดตัวละคร/นักแสดง<br>
        หรือค้นหาตัวละครทีละตัวได้ที่แท็บ "ตัวละคร"<br>
        จากนั้นลากรูปขึ้น Tier ได้เลย ✨
      </div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════
   SNOW CANVAS
════════════════════════ */
(()=>{
  const cv=document.getElementById('snowCanvas'),cx=cv.getContext('2d');
  let W,H;const r=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};r();addEventListener('resize',r);

  // Simplified snowflake: only circles and diamonds (skip 6-arm for perf)
  function drawFlake(x,y,sz,a,rot,type){
    cx.save();cx.translate(x,y);cx.rotate(rot);cx.globalAlpha=a;
    cx.fillStyle='rgba(220,240,255,0.85)';
    if(type===0){
      cx.beginPath();cx.arc(0,0,sz,0,Math.PI*2);cx.fill();
    } else {
      // diamond (faster than 6-arm)
      cx.beginPath();cx.moveTo(0,-sz*1.5);cx.lineTo(sz*.8,0);cx.lineTo(0,sz*1.5);cx.lineTo(-sz*.8,0);cx.closePath();
      cx.fill();
    }
    cx.restore();
  }

  let windX=0;
  // Reduced from 65→45 flakes, use 2 types only
  const flakes=Array.from({length:45},(_,i)=>({
    x:Math.random()*2000,y:Math.random()*900,
    sz:Math.random()*2.5+.8,
    vx:(Math.random()-.5)*.2,
    vy:Math.random()*.5+.15,
    rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.01,
    sway:Math.random()*Math.PI*2,swayS:Math.random()*.007+.003,
    amp:Math.random()*.25+.1,
    a:Math.random()*.5+.25,
    type:i%2, // only 2 types
  }));

  function loop(){
    cx.clearRect(0,0,W,H);
    if(Math.random()<.003)windX=(Math.random()-.4)*.3;
    windX+=(.06-windX)*.003;
    flakes.forEach(f=>{
      f.sway+=f.swayS;f.rot+=f.rotV;
      f.x+=f.vx+windX+Math.sin(f.sway)*f.amp;
      f.y+=f.vy;
      if(f.y>H+20){f.y=-20;f.x=Math.random()*W;}
      if(f.x>W+30)f.x=-30;if(f.x<-30)f.x=W+30;
      drawFlake(f.x,f.y,f.sz,f.a,f.rot,f.type);
    });
    requestAnimationFrame(loop);
  }loop();
})();

function mkCard(item,src,idx){
  const sz=parseInt(szSlider.value)||100;

  c.draggable=true;

  img.onerror=()=>{img.src=`data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect fill='%23112233' width='80' height='80'/><text x='50%25' y='55%25' font-size='26' text-anchor='middle' fill='%23556677'>?</text></svg>`;};
  const del=document.createElement('div');del.className='cdel';del.textContent='✕';
  del.addEventListener('click',e=>{e.stopPropagation();rmCard(src,idx);});
  const tip=document.createElement('div');tip.className='ctip';tip.textContent=item.name;
  c.append(img,del,tip);
  c.addEventListener('dragstart',e=>{
    drag={src,idx,item};c.classList.add('dragging');
    document.getElementById('gimg').src=item.img;
    document.getElementById('ghost').style.display='block';
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setDragImage(new Image(),0,0);
  });
  c.addEventListener('dragend',()=>{
    c.classList.remove('dragging');
    document.getElementById('ghost').style.display='none';
    drag=null;
  });
  return c;
}

════════════════════════ */
function dzo(e,el){e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('over');}
function dzl(el){el.classList.remove('over');}
function dzd(e,dest){
  e.preventDefault();
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  if(!drag)return;
  const{src,idx,item}=drag;
  if(src===dest)return;
  if(src==='pool')pool.splice(idx,1);else tiers[src].items.splice(idx,1);
  if(dest==='pool')pool.push(item);else tiers[dest].items.push(item);
  drag=null;rb();rp();
}

  const added=[];
  try{
    const res=await fetch(`https://api.themoviedb.org/3/movie/${selMovie.id}/credits?api_key=${TMDB_KEY}&language=en-US`).then(r=>r.ok?r.json():null).catch(()=>null);
    if(res?.cast?.length){
      res.cast.slice(0,30).forEach(actor=>{
        if(!actor.profile_path)return;
        const img=`https://image.tmdb.org/t/p/w185${actor.profile_path}`;
        // Show character name if available, else actor name
        const charName=actor.character&&actor.character!=='Self'?actor.character:actor.name||'Unknown';
        const dup=[...pool,...tiers.flatMap(t=>t.items)].some(x=>x.name===charName&&x.img===img);
        if(!dup){pool.push({name:charName,img,type:'movie',actorName:actor.name||''});added.push(charName);}
      });
    }
    rp();
    prog.textContent=added.length?`✅ โหลด ${added.length} ตัวละครเรียบร้อย!`:'⚠️ ไม่พบรูปนักแสดง';
    toast(added.length?`🎬 โหลด ${added.length} ตัวละครจาก "${selMovie.title}"`:'⚠️ ไม่พบรูปนักแสดง');
  }catch(err){
    console.error(err);
    prog.textContent='⚠️ โหลดไม่สำเร็จ ลองใหม่';
    toast('⚠️ โหลดนักแสดงไม่สำเร็จ');
  }finally{
    loadingCast=false;btn.disabled=false;btn.innerHTML='⬇ โหลดอีกครั้ง';
  }
}

/* ════════════════════════
   EXPORT
════════════════════════ */
async function doExport(){
  toast('📷 กำลัง export…');
  try{
    const m=await import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.esm.min.js');
    const h2c=m.default||m;
    const el=document.getElementById('boardWrap');
    const canvas=await h2c(el,{backgroundColor:'#060d18',scale:2,useCORS:true,logging:false,allowTaint:true});
    const a=document.createElement('a');a.download='anime-tierlist.png';a.href=canvas.toDataURL();a.click();
    toast('✅ บันทึกรูปแล้ว!');
  }catch{toast('⚠️ ใช้ Screenshot แทนนะครับ');}
}

/* ════════════════════════
   TOAST
════════════════════════ */
function toast(msg){
  const w=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250);},2500);
}

/* ════════════════════════
   PAGE TRANSITION
════════════════════════ */
const curtain=document.getElementById('curtain');
requestAnimationFrame(()=>requestAnimationFrame(()=>curtain.classList.add('fade-in')));
function warpTo(url){
  curtain.classList.remove('fade-in');curtain.classList.add('fade-out');
  setTimeout(()=>location.href=url,300);
}

rb();rp();
